<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — TractorRental</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body>
    <div class="mobile-header">
        <button class="mobile-toggle">☰</button>
        <span style="margin-left:12px;font-weight:600">TractorRental</span>
    </div>
    <div class="mobile-overlay"></div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <div class="page-header stagger">
                <h1>Dashboard</h1>
                <p class="page-subtitle">Visão geral da frota e operações</p>
            </div>
            
            <div class="stats-grid stagger">
                <div class="stat-card">
                    <div class="stat-icon green">🚜</div>
                    <div class="stat-label">Total de Tratores</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">✅</div>
                    <div class="stat-label">Operacionais</div>
                    <div class="stat-value" id="stat-operacionais">0</div>
                </div>
                <div class="stat-card accent-info">
                    <div class="stat-icon blue">📋</div>
                    <div class="stat-label">Alugados</div>
                    <div class="stat-value" id="stat-alugados">0</div>
                </div>
                <div class="stat-card accent-danger">
                    <div class="stat-icon red">🔧</div>
                    <div class="stat-label">Em Manutenção</div>
                    <div class="stat-value" id="stat-manutencao">0</div>
                </div>
            </div>

            <div class="cards-grid-2 stagger">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Distribuição da Frota</h2>
                    </div>
                    <div class="card-body">
                        <div id="chart-container" style="display:flex; justify-content:center; align-items:center; flex-direction:column; min-height: 200px;">
                            <div class="loading-spinner"></div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Resumo Operacional</h2>
                    </div>
                    <div class="card-body">
                        <div id="summary-container" style="min-height: 200px;">
                            <div class="loading-spinner"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card stagger">
                <div class="card-header">
                    <h2 class="card-title">Últimos Alertas</h2>
                </div>
                <div class="card-body" id="recent-alerts" style="min-height: 100px;">
                    <div class="empty-state">
                        <div class="empty-state-icon">✅</div>
                        <div class="empty-state-text">Nenhum alerta recente</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
