<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frota — TractorRental</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="mobile-header">
        <button class="mobile-toggle">☰</button>
        <span style="margin-left:12px;font-weight:600">TractorRental</span>
    </div>
    <div class="mobile-overlay"></div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <div class="page-header">
                <div class="page-header-row">
                    <div>
                        <h1>Monitoramento da Frota</h1>
                        <p class="page-subtitle">Telemetria em tempo real dos equipamentos</p>
                    </div>
                    <div>
                        <button class="btn btn-primary" onclick="showModal('modal-trator')">Novo Trator</button>
                    </div>
                </div>
            </div>

            <div id="tratores-container" class="cards-grid stagger">
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Novo Trator -->
    <div class="modal-overlay" id="modal-trator">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Cadastrar Novo Trator</h2>
                <button class="modal-close" onclick="hideModal('modal-trator')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="input-marca">Marca</label>
                    <select class="form-input" id="input-marca">
                        <option value="">Selecione a marca...</option>
                        <option value="JohnDeere">John Deere</option>
                        <option value="MasseyFerguson">Massey Ferguson</option>
                        <option value="Valtra">Valtra</option>
                        <option value="NewHolland">New Holland</option>
                        <option value="CaseIH">Case IH</option>
                        <option value="Agrale">Agrale</option>
                        <option value="Caterpillar">Caterpillar</option>
                        <option value="Kubota">Kubota</option>
                        <option value="Outra">Outra</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="input-modelo">Modelo</label>
                    <input class="form-input" type="text" id="input-modelo" placeholder="Ex: 8R 370">
                </div>
                <div class="form-group">
                    <label class="form-label" for="input-ano">Ano de Fabricação</label>
                    <input class="form-input" type="number" id="input-ano" placeholder="Ex: 2022">
                </div>
                <div class="form-group">
                    <label class="form-label" for="input-potencia">Potência (CV)</label>
                    <input class="form-input" type="number" id="input-potencia" placeholder="Ex: 370">
                </div>
                <div class="form-group">
                    <label class="form-label" for="input-horimetro">Horímetro Inicial (h)</label>
                    <input class="form-input" type="number" id="input-horimetro" placeholder="Ex: 1250" value="0">
                </div>
                <div class="form-group">
                    <label class="form-label" for="input-serie">Nº de Série (PIN)</label>
                    <input class="form-input" type="text" id="input-serie" placeholder="Ex: 1LV8370RCNR000123">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideModal('modal-trator')">Cancelar</button>
                <button class="btn btn-primary" onclick="salvarTrator()">Salvar</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/tratores.js"></script>
</body>
</html>
