<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes — TractorRental</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="mobile-header">
        <button class="mobile-toggle">☰</button>
        <span style="margin-left:12px;font-weight:600">TractorRental</span>
    </div>
    <div class="mobile-overlay"></div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <div class="page-header">
                <div class="page-header-row">
                    <div>
                        <h1>Gestão de Clientes</h1>
                        <p class="page-subtitle">Gerencie o cadastro de clientes do sistema</p>
                    </div>
                    <button class="btn btn-primary" onclick="showModal('modal-cliente')">Novo Cliente</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Clientes Cadastrados</h2>
                    <span class="badge badge-info" id="count-clientes">0</span>
                </div>
                <div class="card-body">
                    <div id="loading-clientes" class="loading-spinner">
                        <div class="spinner"></div>
                    </div>
                    <div id="empty-clientes" class="empty-state" style="display: none;">
                        <div class="empty-state-icon">👥</div>
                        <div class="empty-state-text">Nenhum cliente cadastrado</div>
                    </div>
                    <div class="table-container" id="container-clientes" style="display: none;">
                        <table class="data-table" id="tabela-clientes">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Documento</th>
                                    <th>Data Cadastro</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Novo Cliente -->
    <div class="modal-overlay" id="modal-cliente">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Novo Cliente</h3>
                <button class="modal-close" onclick="hideModal('modal-cliente')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="input-nome">Nome</label>
                    <input type="text" id="input-nome" class="form-input" placeholder="Nome completo ou Razão Social">
                </div>
                <div class="form-group">
                    <label class="form-label" for="input-documento">Documento</label>
                    <input type="text" id="input-documento" class="form-input" placeholder="CPF ou CNPJ">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideModal('modal-cliente')">Cancelar</button>
                <button class="btn btn-primary" onclick="salvarCliente()">Salvar</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/clientes.js"></script>
</body>
</html>
