<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Alertas — TractorRental</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body>
    <div class="mobile-header">
        <button class="mobile-toggle">☰</button>
        <span style="margin-left:12px;font-weight:600">TractorRental</span>
    </div>
    <div class="mobile-overlay"></div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <div class="page-header" id="alertas-page-header">
                <div class="page-header-row">
                    <div>
                        <h1>Central de Alertas <span class="badge badge-danger" id="alert-count">0</span></h1>
                        <p class="page-subtitle">Monitoramento em tempo real via SignalR</p>
                    </div>
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <span id="conn-status" class="connection-status disconnected">● Desconectado</span>
                    </div>
                </div>
            </div>

            <div id="alertas-container" class="stagger" style="display: flex; flex-direction: column; gap: 16px;">
                <div id="empty-alertas" class="empty-state">
                    <div class="empty-state-icon">🔔</div>
                    <div class="empty-state-text">Aguardando alertas...</div>
                    <div class="empty-state-text" style="font-size: 0.9em; opacity: 0.7; margin-top: 8px;">Os alertas aparecerão aqui em tempo real quando os sensores detectarem anomalias</div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/alertas.js"></script>
</body>
</html>
