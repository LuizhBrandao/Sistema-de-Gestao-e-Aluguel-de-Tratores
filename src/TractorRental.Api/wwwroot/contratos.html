<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratos — TractorRental</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="mobile-header">
        <button class="mobile-toggle">☰</button>
        <span style="margin-left:12px;font-weight:600">TractorRental</span>
    </div>
    <div class="mobile-overlay"></div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <div class="page-header">
                <div class="page-header-row">
                    <div>
                        <h1>Contratos de Aluguel</h1>
                        <p class="page-subtitle">Gerencie os aluguéis de tratores</p>
                    </div>
                    <button class="btn btn-primary" onclick="openNovoContrato()">Novo Contrato</button>
                </div>
            </div>

            <div class="stats-grid" style="grid-template-columns: repeat(2, 1fr); margin-bottom: 24px;">
                <div class="stat-card">
                    <div class="stat-icon green">📄</div>
                    <div class="stat-value" id="count-ativos">0</div>
                    <div class="stat-label">Contratos Ativos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon gray">📁</div>
                    <div class="stat-value text-muted" id="count-finalizados">0</div>
                    <div class="stat-label">Contratos Finalizados</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Lista de Contratos</h2>
                </div>
                <div class="card-body">
                    <div id="loading-contratos" class="loading-spinner">
                        <div class="spinner"></div>
                    </div>
                    <div id="empty-contratos" class="empty-state" style="display: none;">
                        <div class="empty-state-icon">📄</div>
                        <div class="empty-state-text">Nenhum contrato encontrado</div>
                    </div>
                    <div class="table-container" id="container-contratos" style="display: none;">
                        <table class="data-table" id="tabela-contratos">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente ID</th>
                                    <th>Trator ID</th>
                                    <th>Data Início</th>
                                    <th>Valor/Hora</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Novo Contrato -->
    <div class="modal-overlay" id="modal-contrato">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Novo Contrato</h3>
                <button class="modal-close" onclick="hideModal('modal-contrato')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="select-cliente">Cliente</label>
                    <select id="select-cliente" class="form-select">
                        <option value="">Selecione um cliente...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="select-trator">Trator (Operacional)</label>
                    <select id="select-trator" class="form-select">
                        <option value="">Selecione um trator...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="input-valor">Valor/Hora (R$)</label>
                    <input type="number" id="input-valor" class="form-input" placeholder="Ex: 150.00" step="0.01">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideModal('modal-contrato')">Cancelar</button>
                <button class="btn btn-primary" onclick="salvarContrato()">Salvar</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/contratos.js"></script>
</body>
</html>
