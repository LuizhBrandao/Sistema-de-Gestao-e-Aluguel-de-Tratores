version: '3.8'

services:
  # 1. Banco de Dados SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=TractorAdmin@123!
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql

  # 2. Mensageria RabbitMQ (Com interface web)
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # Porta do sistema
      - "15672:15672" # Porta do painel de controle (Navegador)

  # 3. Nossa API Minimalista + Interface Fullstack
  api:
    build:
      context: . # Usa a pasta raiz como contexto
      dockerfile: src/TractorRental.Api/Dockerfile
    ports:
      - "5257:8080"
    environment:
      # Sobrescreve as configurações do appsettings.json
      - ASPNETCORE_ENVIRONMENT=Development 
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TractorRentalDb;User Id=sa;Password=TractorAdmin@123!;TrustServerCertificate=True;
      - RabbitHost=rabbitmq
    depends_on:
      - sqlserver
      - rabbitmq

  # 4. Nosso Consumidor Background IoT
  worker:
    build:
      context: .
      dockerfile: src/TractorRental.IoTWorker/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TractorRentalDb;User Id=sa;Password=TractorAdmin@123!;TrustServerCertificate=True;
      - RabbitHost=rabbitmq
    depends_on:
      - sqlserver
      - rabbitmq

# Salva os dados do banco para não perder ao desligar o Docker
volumes:
  sqlvolume: